---
layout: default
---
<article class="project-detail">
  <header class="page-heading">
    <p class="eyebrow">{% if page.placeholder %}Placeholder project{% else %}Project{% endif %}</p>
    <h1>{{ page.title | escape }}</h1>
    <p>{{ page.description | escape }}</p>
  </header>
  {% if page.image %}<img class="project-detail-image" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: '' | escape }}" width="640" height="400">{% endif %}
  <div class="project-body">{{ content }}</div>
  <a class="text-link" href="{{ '/projects/' | relative_url }}">← All projects</a>
</article>
